# Modern HTTP security headers. Calibrated against what actually ships today
# (jarvis/api/static/{dashboard,desktop,desktop_login}.html use inline
# <script>/<style> and no external CDN/font — confirmed by reading those
# files, not assumed) so nothing here breaks the current app. Tightening the
# CSP (dropping 'unsafe-inline' in favour of nonces/hashes) is listed as a
# follow-up in docs/INFRASTRUCTURE.md, not done here — that would need
# changes to the static pages themselves, which is out of scope for this
# infra-only phase.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# Headers only make sense over HTTPS (HSTS in particular) — this file is only
# included from the :443 server block, never from the :80 redirect block.
