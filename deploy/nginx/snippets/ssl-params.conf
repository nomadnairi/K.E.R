# TLS configuration — Mozilla "Intermediate" profile (broad compatibility,
# still modern): TLS 1.2 + 1.3 only, strong ciphers, OCSP stapling, sane
# session cache. Included from the server block in templates/ker.conf.template.
# Reference: https://ssl-config.mozilla.org/ (Intermediate, nginx, no external
# fetch performed — this is a static, well-known baseline).

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling — the client trusts our cert's revocation status without an
# extra round trip to the CA.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

ssl_dhparam /etc/nginx/ssl/dhparam.pem;
