# K.E.R. — main Nginx config.
#
# Kept deliberately generic: everything specific to a domain or backend lives
# in deploy/nginx/templates/ker.conf.template (rendered to conf.d/ker.conf at
# container start by the official nginx image's envsubst templating) plus the
# snippets/ directory. See docs/INFRASTRUCTURE.md for the full picture.

user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide the Nginx version from responses and error pages.
    server_tokens off;

    # -- safe access logging --------------------------------------------------
    # Deliberately logs the path only ($uri), never the raw request line
    # ($request), so query strings — which can carry a bearer token on the
    # /ws and /dashboard/ws routes — never land in Nginx's own access log.
    # This does not change what the upstream application logs; see
    # docs/INFRASTRUCTURE.md's "Рекомендации для фазы Security Audit Fix".
    log_format ker_safe
        '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'rt=$request_time';

    access_log /var/log/nginx/access.log ker_safe;
    error_log  /var/log/nginx/error.log warn;

    # -- performance ------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # Conservative default proxy timeouts; the WebSocket locations override
    # proxy_read_timeout to stay open for long-lived connections.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    # Brotli is not compiled into the stock nginx:alpine image; gzip above
    # already satisfies "gzip or Brotli". Swapping to an nginx build with the
    # brotli module is a documented optional upgrade in docs/INFRASTRUCTURE.md.

    include /etc/nginx/conf.d/*.conf;
}
